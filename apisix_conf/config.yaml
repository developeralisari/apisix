# APISIX ana konfigürasyonu (traditional mode + etcd).
# Hassas değer (admin key) buraya yazılmaz; APISIX, container ortam
# değişkeninden ${{APISIX_ADMIN_KEY}} ile runtime'da okur. Bu nedenle
# bu dosya güvenle git'e commit edilebilir.

apisix:
  node_listen: 9080
  enable_admin: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    # Dokploy iç ağından erişime izin ver. Admin API (9180) public'e
    # açılmamalı — Dokploy tarafında kısıtlanmalı.
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    admin_key:
      - name: admin
        key: "${{APISIX_ADMIN_KEY}}"
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30
