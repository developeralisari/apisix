# APISIX ana konfigürasyonu (traditional mode + etcd).
# Hassas değer (admin key) buraya yazılmaz; APISIX, container ortam
# değişkeninden ${{APISIX_ADMIN_KEY}} ile runtime'da okur. Bu nedenle
# bu dosya güvenle git'e commit edilebilir.

apisix:
  node_listen: ${{APISIX_PROXY_PORT}}
  enable_admin: true

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    # Dokploy iç ağından erişime izin ver. Admin API public'e açılmamalı
    # — yönlendirme/kısıtlama Dokploy tarafında yapılmalı.
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: ${{APISIX_ADMIN_PORT}}
    admin_key:
      - name: admin
        key: "${{APISIX_ADMIN_KEY}}"
        role: admin
  etcd:
    host:
      - "http://etcd:${{ETCD_CLIENT_PORT}}"
    prefix: /apisix
    timeout: 30
