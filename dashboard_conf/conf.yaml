# APISIX Dashboard konfigürasyon ŞABLONU.
# Dashboard, conf.yaml içinde ortam değişkeni ikamesini DESTEKLEMEZ.
# Bu yüzden aşağıdaki __PLACEHOLDER__ değerleri, container başlarken
# docker-compose'taki entrypoint tarafından `sed` ile .env'den doldurulur.
# Böylece secret/parola git'e commit edilmez.
#
# UYARI: Parola/secret değerlerinde `|` karakteri KULLANMAYIN (sed sınırlayıcısı).

conf:
  listen:
    host: 0.0.0.0
    port: __DASHBOARD_PORT__
  etcd:
    endpoints:
      - "etcd:__ETCD_PORT__"
  log:
    error_log:
      level: warn
      file_path: /dev/stderr
    access_log:
      file_path: /dev/stdout
  plugins:
    - response-rewrite

authentication:
  secret: "__JWT_SECRET__"
  expire_time: 3600
  users:
    - username: "__ADMIN_USER__"
      password: "__ADMIN_PASSWORD__"
